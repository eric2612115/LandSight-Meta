[project]
name = "landsight"
version = "0.1.0"
description = "Quantity take-off, regulation check and quotation from a landscape construction drawing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pymupdf>=1.26,<2",
    "python-pptx>=1.0.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
    "xlsxwriter>=3.3.1",
    "xlwt>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "xlrd>=2.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
