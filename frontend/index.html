<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Landsight</title>
    <script>
      // the theme before first paint, so there is no flash: ?theme=dark|light, else this browser's choice
      // (localStorage landsight.theme), else the system (index.css's prefers-color-scheme rule); src/lib/theme.ts keeps it
      ;(function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('landsight.theme')
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          /* no storage */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
